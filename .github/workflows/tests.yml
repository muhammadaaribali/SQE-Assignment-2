name: Tests and coverage

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Record environment and tested commit
        run: |
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/commit.txt
          python --version > artifacts/python.txt
          python -m pip freeze > artifacts/dependencies.txt
      - name: Run tests with statement and branch coverage
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests/ -v --tb=short --color=no \
            --cov=registration --cov-branch --cov-report=term-missing \
            --cov-report=xml:artifacts/coverage.xml \
            --cov-report=json:artifacts/coverage.json \
            --cov-report=html:artifacts/htmlcov \
            --junitxml=artifacts/junit.xml 2>&1 | tee artifacts/pytest.txt
      - name: Preserve evidence even when tests fail
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 90
